name: Waka Readme

on:
  # Schedule paused: the profile README no longer has the waka section markers.
  # Restore the cron below (and the markers) to resume the stats.
  # schedule:
  #   - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          COMMIT_BY_ME: "True"                     # Commit as YOU, not a bot! Flex time 🕺
          COMMIT_MESSAGE: "🔥 Updated with Dev Metrics by my main man 🔥"

          SHOW_UPDATED_DATE: "True"                # When was the last flex?
          UPDATED_DATE_FORMAT: "%d/%m/%Y %H:%M:%S"

          SHOW_LINES_OF_CODE: "True"               # Show those code muscles 💪
          SHOW_TOTAL_CODE_TIME: "True"             # Total grind hours = respect

          SHOW_LANGUAGE: "True"                    # Languages you slay in 🔥
          SHOW_DAYS_OF_WEEK: "True"                # When you boss the hardest 📅
          SHOW_PROJECTS: "False"                    # Projects you’re killin’ it on 🐱‍💻

          SHOW_EDITORS: "False"                     # IDEs where the magic happens ✨
